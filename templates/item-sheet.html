<div class="sheet-panel">
    <header class="sheet-header">
        <img src="{{item.img}}" data-action="editImage" data-field="img" title="{{item.name}}" height="64" width="64" />
        <h1><input name="name" type="text" value="{{item.name}}" placeholder="{{localize 'DW.ItemName'}}" /></h1>
    </header>
    <div id="bio-panel">
        <h2>{{localize 'DW.ItemDescription'}}</h2>
        {{#if editable}}
        <prose-mirror name="system.description" value="{{source.system.description}}" toggled="true" collaborate="false">
            {{{enrichedDescription}}}
        </prose-mirror>
        {{else}}
        <div class="editor">{{{enrichedDescription}}}</div>
        {{/if}}
    </div>
</div>
