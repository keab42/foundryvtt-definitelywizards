pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,mjs,json,css}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{js,mjs,ts}"
      run: npm run typecheck
    foundry-check:
      run: npm run check:foundry
